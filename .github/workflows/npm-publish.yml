# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish Package to npmjs

on:
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: read
      # id-token: write is required for the automatic generation of provenance statements
      id-token: write
    runs-on: ubuntu-latest
    # The GitHub Actions Environment containing the `NPM_TOKEN`secret
    environment: npmjs:@sap_oss/automated-usage-tracking-tool
    steps:
      - uses: actions/checkout@v4
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build

      - name: Publish package
        # --provenance enables the automatic generation of provenance statements (when using trusted publisher, this is automatically enabled and therefore optional) 
        # --access public is only hard required for the initial release, but it doesn't hurt having it setup
        # npm version >=11.5.1 required for trusted publisher
        run: npm publish --provenance --access public
